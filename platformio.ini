; ==============================================================================
; AMBIENTE 1 — ESP32 Clássico (placa original, backup de segurança)
; ==============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DTARGET_ESP32_CLASSIC          ; Ativa pinos do ESP32 clássico no main.cpp
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
    bblanchon/ArduinoJson @ ^7.0.0
    earlephilhower/ESP8266Audio @ ^1.9.7
    tzapu/WiFiManager @ ^2.0.17

; ==============================================================================
; AMBIENTE 2 — ESP32-S3 N16R8 DevKitC-1 (nova placa, 8MB PSRAM)
; ==============================================================================
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; PSRAM OPI — obrigatório para o N16R8 (8MB PSRAM via barramento Octal)
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; -DARDUINO_USB_CDC_ON_BOOT=1     ; Desabilitado para garantir que o Serial saia na porta UART0
    ; -DARDUINO_USB_MODE=1
    -DTARGET_ESP32_S3               ; Ativa pinos do S3 no main.cpp
    -DUSER_SETUP_LOADED             ; TFT_eSPI usa o nosso include/User_Setup.h
    -include include/User_Setup.h   ; Inclui as definicoes do display automaticamente

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    earlephilhower/ESP8266Audio @ ^1.9.7
    tzapu/WiFiManager @ ^2.0.17
    bodmer/TFT_eSPI @ ^2.5.43        ; Display ST7789 240x240
